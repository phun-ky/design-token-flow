<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design Token Flow</title>
    <script>
      // Apply the saved (or system) theme before the first paint, see src/app/theme.ts
      try {
        const theme =
          localStorage.getItem('dtf-theme') ??
          (matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark');

        if (theme === 'light')
          document.documentElement.classList.add('theme--light');
      } catch {}
    </script>
  </head>
  <body>
    <main class="app-main">
      <div class="app-page-header">
        <h1>Token flow</h1>
      </div>
      <!-- The canvas: one Tab stop, the skip link's target, see src/app/zoom.ts -->
      <div
        class="app-viewport"
        id="content"
        tabindex="0"
        role="region"
        aria-label="Token flow canvas"
        aria-describedby="canvas-keys"
      >
        <div class="container" id="scene"></div>
      </div>
      <p id="canvas-keys" class="visually-hidden">
        Arrow keys pan, Shift and an arrow key pan further, plus and minus zoom,
        0 resets to 100 percent, the page width, and F fits the flow to the
        screen.
      </p>
    </main>
    <script type="module">
      import '../src/styles/index.css';
      import '../src/main.ts';
    </script>
  </body>
</html>
