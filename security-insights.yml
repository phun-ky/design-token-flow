header:
  schema-version: 2.2.0
  last-updated: '2026-11-05'
  last-reviewed: '2026-11-05'
  url: https://raw.githubusercontent.com/phun-ky/design-token-flow/main/security-insights.yml
  comment: |
    Security information for the Design Token Flow website, in the OpenSSF
    Security Insights format. Keep it in step with SECURITY.md.

project:
  name: Design Token Flow
  homepage: https://github.com/phun-ky/design-token-flow
  roadmap: https://github.com/phun-ky/design-token-flow/milestones
  funding: https://github.com/sponsors/phun-ky
  administrators:
    - name: Alexander Vassbotn Røyne-Helgesen
      social: https://github.com/phun-ky
      primary: true
  documentation:
    support-policy: https://github.com/phun-ky/design-token-flow/blob/main/SECURITY.md#supported-versions
  repositories:
    - name: design-token-flow
      url: https://github.com/phun-ky/design-token-flow
      comment: |
        The website's source. Not deployed yet; it will be deployed to GitHub
        Pages on every merge to main.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/phun-ky/design-token-flow/blob/main/SECURITY.md
    comment: |
      Report privately with GitHub's private vulnerability reporting
      (https://github.com/phun-ky/design-token-flow/security/advisories/new)
      or by email to the contact below.
    contact:
      name: Design Token Flow security contact
      email: security@phun-ky.net
      primary: true

repository:
  url: https://github.com/phun-ky/design-token-flow
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  no-third-party-packages: false
  core-team:
    - name: Alexander Vassbotn Røyne-Helgesen
      social: https://github.com/phun-ky
      primary: true
  documentation:
    security-policy: https://github.com/phun-ky/design-token-flow/blob/main/SECURITY.md
    dependency-management-policy: https://github.com/phun-ky/design-token-flow/blob/main/SECURITY.md#dependencies
  license:
    url: https://github.com/phun-ky/design-token-flow/blob/main/LICENSE
    expression: MIT
  security:
    assessments:
      self:
        evidence: https://github.com/phun-ky/design-token-flow/blob/main/SECURITY.md#security-expectations
        date: '2026-11-05'
        comment: |
          The security expectations in SECURITY.md list what the site
          guarantees and the known gaps, each linked to the issue that
          closes it.
    tools:
      - name: CodeQL
        type: SAST
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          GitHub default setup, scanning JavaScript/TypeScript and the GitHub
          Actions workflows on every push to main and every pull request.
      - name: Dependabot
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
        comment: |
          Weekly checks of the npm dependencies, with update pull requests,
          and security updates when an advisory is published.
