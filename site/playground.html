<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Pill Playground</title>
    <meta
      name="description"
      content="Edit DTCG 2025.10 design token JSON and see every token rendered as a pill, with its resolved value, relations and generated HTML."
    />
    <link
      rel="canonical"
      href="https://phun-ky.net/site-design-token-flow/playground"
    />
    <meta
      name="theme-color"
      content="#1b1b1f"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Design Token Flow" />
    <meta property="og:title" content="Token Pill Playground" />
    <meta
      property="og:description"
      content="Edit DTCG 2025.10 design token JSON and see every token rendered as a pill, with its resolved value, relations and generated HTML."
    />
    <meta
      property="og:url"
      content="https://phun-ky.net/site-design-token-flow/playground"
    />
    <meta
      property="og:image"
      content="https://phun-ky.net/site-design-token-flow/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Design Token Flow: four design tokens as pills, each alias joined by a line to the token it references, from a button background color down to its base blue."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Token Pill Playground" />
    <meta
      name="twitter:description"
      content="Edit DTCG 2025.10 design token JSON and see every token rendered as a pill, with its resolved value, relations and generated HTML."
    />
    <meta
      name="twitter:image"
      content="https://phun-ky.net/site-design-token-flow/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Design Token Flow: four design tokens as pills, each alias joined by a line to the token it references, from a button background color down to its base blue."
    />
    <script>
      // Apply the saved (or system) theme before the first paint, see src/app/theme.ts
      try {
        const theme =
          localStorage.getItem('dtf-theme') ??
          (matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark');

        if (theme === 'light')
          document.documentElement.classList.add('theme--light');
      } catch {}
    </script>
  </head>
  <body>
    <main class="demo-main" id="content" tabindex="-1">
      <div class="demo-header">
        <h1>Token pill playground</h1>
        <label class="demo-field">
          <span>Tokens</span>
          <select id="preset">
            <option value="showcase">Showcase (every $type)</option>
            <option value="bundled">Bundled design-tokens.tokens.json</option>
            <option value="custom">Custom (your edits)</option>
          </select>
        </label>
        <label class="demo-field">
          <span>Prefix</span>
          <input id="prefix" type="text" value="$" size="3" />
        </label>
      </div>

      <div class="demo-layout">
        <section class="demo-panel demo-editor">
          <h2>DTCG 2025.10 JSON</h2>
          <!-- The highlighted copy sits under the textarea, which shows the caret -->
          <div class="demo-source">
            <div class="demo-source-code" aria-hidden="true"></div>
            <textarea
              id="source"
              spellcheck="false"
              aria-label="Design tokens JSON"
            ></textarea>
          </div>
          <p id="error" class="demo-error" role="alert" hidden></p>
        </section>

        <section class="demo-panel demo-output">
          <div class="demo-toolbar">
            <h2>Rendered pills <span id="count" class="demo-muted"></span></h2>
            <input
              id="filter"
              type="search"
              placeholder="Filter by name or $type"
              aria-label="Filter tokens"
            />
          </div>
          <div id="groups"></div>
        </section>

        <aside class="demo-panel demo-details" id="details">
          <h2>Details</h2>
          <p class="demo-muted">
            Select a pill to see its token, resolved value, relations and
            generated HTML.
          </p>
        </aside>
      </div>
    </main>

    <script type="module" src="./playground-main.ts"></script>
  </body>
</html>
