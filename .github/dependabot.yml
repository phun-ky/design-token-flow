version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Minor and patch updates rarely break anything, so they come in one PR.
    # Majors are not grouped: each gets its own PR, so one blocked major does
    # not hold back the others
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    # Only propose versions published at least two weeks ago: a compromised
    # release is usually caught within days. Security updates still open at once
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct

  # Actions are pinned to commit SHAs; this keeps the pins and their version
  # comments up to date
  - package-ecosystem: 'github-actions'
    directory: '/'
    groups:
      actions:
        patterns:
          - '*'
    schedule:
      interval: 'weekly'
    # Same two-week cooldown as npm, for the same reason
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'ci: 🎡 '
