# Labels from changed files: rules only for files this repository has
'section: workflows':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - .github/workflows/**
'section: repo':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '*'
'section: tests':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '**/__tests__/**'
'experience: developer':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '.browserslistrc'
              - '.editorconfig'
              - '.gitignore'
              - '.prettierrc'
              - '.prettierignore'
              - 'eslint.config.js'
              - 'tsconfig*.json'
              - 'vite.config.ts'
'experience: visual':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.styl'
              - '**/*.css'
'context: github':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - .github/**
'context: npm':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'package.json'
'mindless: 📦 dependencies':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'package-lock.json'
'mindless: ✏️ docs':
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.md'

# Labels from the branch name, anchored to the prefix and its slash, so
# docs/fix-typo is not labelled as a bug
'✨ feature':
  - head-branch: ['^feat/']
'problems: 🐛 bug':
  - head-branch: ['^fix/']
'mindless: 🤖 chore':
  - head-branch: ['^chore/']
'improvements: 💡 enhancement':
  - head-branch: ['^improvements/']
