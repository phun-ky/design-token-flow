header:
  schema-version: 2.2.0
  last-updated: '2026-11-06'
  last-reviewed: '2026-11-06'
  url: https://raw.githubusercontent.com/phun-ky/site-design-token-flow/main/security-insights.yml
  comment: |
    Security information for the Design Token Flow website, in the OpenSSF
    Security Insights format. Keep it in step with SECURITY.md.

project:
  name: Design Token Flow
  homepage: https://phun-ky.net/site-design-token-flow/
  roadmap: https://github.com/phun-ky/site-design-token-flow/blob/main/ROADMAP.md
  funding: https://github.com/sponsors/phun-ky
  administrators:
    - name: Alexander Vassbotn Røyne-Helgesen
      social: https://github.com/phun-ky
      primary: true
  documentation:
    detailed-guide: https://github.com/phun-ky/site-design-token-flow/blob/main/CONTRIBUTING.md#architecture
    code-of-conduct: https://github.com/phun-ky/site-design-token-flow/blob/main/CODE_OF_CONDUCT.md
    support-policy: https://github.com/phun-ky/site-design-token-flow/blob/main/SECURITY.md#supported-versions
  repositories:
    - name: site-design-token-flow
      url: https://github.com/phun-ky/site-design-token-flow
      comment: |
        The website's source. Every merge to main is deployed to GitHub
        Pages, at https://phun-ky.net/site-design-token-flow/.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/phun-ky/site-design-token-flow/blob/main/SECURITY.md
    comment: |
      Report privately with GitHub's private vulnerability reporting
      (https://github.com/phun-ky/site-design-token-flow/security/advisories/new)
      or by email to the contact below.
    contact:
      name: Design Token Flow security contact
      email: security@phun-ky.net
      primary: true

repository:
  url: https://github.com/phun-ky/site-design-token-flow
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  no-third-party-packages: false
  core-team:
    - name: Alexander Vassbotn Røyne-Helgesen
      social: https://github.com/phun-ky
      primary: true
  documentation:
    contributing-guide: https://github.com/phun-ky/site-design-token-flow/blob/main/CONTRIBUTING.md
    governance: https://github.com/phun-ky/site-design-token-flow/blob/main/GOVERNANCE.md
    review-policy: https://github.com/phun-ky/site-design-token-flow/blob/main/GOVERNANCE.md#reviews
    security-policy: https://github.com/phun-ky/site-design-token-flow/blob/main/SECURITY.md
    dependency-management-policy: https://github.com/phun-ky/site-design-token-flow/blob/main/SECURITY.md#dependencies
  license:
    url: https://github.com/phun-ky/site-design-token-flow/blob/main/LICENSE
    expression: MIT
  security:
    assessments:
      self:
        evidence: https://github.com/phun-ky/site-design-token-flow/blob/main/ASSURANCE.md
        date: '2026-11-06'
        comment: |
          The assurance case: what is protected, the threat model, trust
          boundaries, secure design principles, the weaknesses countered and
          the known gaps, behind the security expectations in SECURITY.md.
    tools:
      - name: CodeQL
        type: SAST
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          GitHub default setup, scanning JavaScript/TypeScript and the GitHub
          Actions workflows on every push to main and every pull request.
      - name: Dependabot
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
        comment: |
          Weekly checks of the npm dependencies, with update pull requests,
          and security updates when an advisory is published.
