name: Checks

on:
  push:
    branches: ['main']
  # No path filter on pull requests: `check` is a required status check, so it
  # has to report on every pull request, or the pull request cannot merge
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read-only by default; jobs ask for what they need
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint # Code and Markdown, zero warnings
        run: npm run lint -- --max-warnings=0
      - name: Check formatting
        run: npm run format:check
      - name: Type-check, tests included
        run: npm run typecheck
      - name: Test # With coverage thresholds
        run: npm run test-ci
      - name: Build
        run: npm run build
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/site-design-token-flow
          files: ./coverage/lcov.info

  notify:
    name: Notify failed check
    needs: check
    # Only for main; a failing pull request already shows its failed check
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      # GITHUB_TOKEN: secrets are empty on Dependabot PRs, and only issues are written here
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
          # The label exists; don't recreate it under another name
          create-label: false
