<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design Token Flow</title>
    <script>
      // Apply the saved (or system) theme before the first paint, see src/app/theme.ts
      try {
        const theme =
          localStorage.getItem('dtf-theme') ??
          (matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark');

        if (theme === 'light')
          document.documentElement.classList.add('theme--light');
      } catch {}
    </script>
  </head>
  <body>
    <main class="app-viewport">
      <div class="container" id="scene"></div>
    </main>
    <script type="module">
      import '../src/styles/index.styl';
      import '../src/main.ts';
    </script>
  </body>
</html>
